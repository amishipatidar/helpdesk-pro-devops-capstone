name: HelpDesk Pro CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/helpdesk-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/helpdesk-frontend

jobs:
  test:
    name: "M2 Quality Gate: Automated Testing & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Run Pytest Suite
        run: pytest -v
        working-directory: backend

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci || npm install
          npm run build
        working-directory: frontend

  build-scan-push:
    name: "M4-M6 Gate: Container Build, Trivy Security Scan & GHCR Push"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

      - name: DevSecOps — Trivy Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: DevSecOps — Trivy Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Push Container Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: "M8 Gate: Helm Deploy to Kubernetes"
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure Kubectl Context & Deploy via Helm
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA detected. Configuring kubectl..."
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
            echo "Deploying HelpDesk Pro via Helm to cluster..."
            helm upgrade --install helpdesk ./helm/helpdesk \
              --namespace helpdesk \
              --create-namespace \
              --set backend.image=${{ env.BACKEND_IMAGE }} \
              --set backend.tag=${{ github.sha }} \
              --set frontend.image=${{ env.FRONTEND_IMAGE }} \
              --set frontend.tag=${{ github.sha }}
          else
            echo "KUBE_CONFIG_DATA not set (cluster not connected). Running Helm template lint validation:"
            helm template helpdesk ./helm/helpdesk \
              --namespace helpdesk \
              --set backend.image=${{ env.BACKEND_IMAGE }} \
              --set backend.tag=${{ github.sha }} \
              --set frontend.image=${{ env.FRONTEND_IMAGE }} \
              --set frontend.tag=${{ github.sha }}
          fi
